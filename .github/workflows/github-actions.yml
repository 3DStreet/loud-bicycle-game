name: GitHub Actions Deployment
on:
  push:
    branches:
      - main
      - publish

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref_name == 'main'
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: Install Dependencies & Build
        run: |
          npm ci
          npm run build

      - name: Generate static index.html from index.php
        run: |
          python3 -c "
          import re
          with open('dist/index.php', 'r') as f:
              content = f.read()
          content = re.sub(r'<\?php.*?\?>', '', content, flags=re.DOTALL)
          content = re.sub(r'<meta\s+(?:property=\"og:|name=\"(?:image|twitter:)).*?>', '', content)
          content = content.replace('<meta charset=\"UTF-8\">', '<meta charset=\"UTF-8\"><!-- OG_TAGS -->')
          content = re.sub(r'  +', ' ', content)
          with open('dist/index.html', 'w') as f:
              f.write(content)
          "

      - name: Deploy to Github Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=loud-bicycle-game

  publish:
    runs-on: ubuntu-latest
    environment: publish
    if: github.ref_name == 'publish'
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: Install Dependencies & Build
        run: |
          npm ci
          npm run build

      - name: Sync files
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.HOST }}
          username: ${{ secrets.username }}
          password: ${{ secrets.password }}
          port: ${{ vars.PORT }}
          sftp_only: true
          local_path: ./dist/*
          remote_path: ./
